# Keeps the free Render instance awake so judges never hit a cold start (Render free services sleep after 15 min idle).
# Delete this file, or disable the workflow in the Actions tab, to stop it.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 90 https://pinthread-d1ya.onrender.com/api/healthz
